version: 2
# Nothing proposed dependency updates in this repo before now, so pins could drift
# silently and a deprecation deadline would arrive unwarned.
#
# `uv`, not `pip`: this project is uv-locked. Dependabot's uv ecosystem (GA March
# 2025) reads pyproject.toml and uv.lock together; the pip ecosystem would update
# pyproject and leave uv.lock stale, which CI installs with --frozen and would fail.
#
# Minor/patch are grouped to keep PR volume low. Majors arrive individually -- those
# carry the runtime bumps and deserve their own CI run. These are proposals for a
# human to judge, NOT auto-merge candidates: a dependabot PR on a sibling repo once
# proposed widening an intentionally-narrow major bound and would have broken the
# build.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      uv-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # `rpy2>=3.5,<3.6` is a RUNTIME-COMPATIBILITY bound, not a stale pin. rpy2
      # >=3.6 needs a newer R than 4.3 -- upstream's 3.6.x docs state R >= 4.5.
      # The full reason is recorded at the pin itself in pyproject.toml.
      #
      # This is not hypothetical, and the mechanism is observed rather than
      # inferred. Dependabot proposed exactly that widening (#25: `<3.6` ->
      # `<3.7`) and ALL THREE test jobs died inside
      # `openrlib.rlib.R_getVar(...)` with "The embedded R is not initialized."
      #
      # Correction to the previous revision of this comment: it said rpy2 >=3.6
      # "requires R >= 4.4" and that 4.3 is "the version Debian and Ubuntu ship".
      # The first understates it (upstream says 4.5); the second is unverified --
      # CRAN publishes 4.5 packages for current Ubuntu, so which R you get
      # depends on whether you use the distro archive or CRAN's.
      #
      # Grouped minor/patch updates do not protect against this: 3.5.17 -> 3.6.7
      # is a minor bump by semver and landed inside the uv-minor-patch group.
      - dependency-name: "rpy2"
